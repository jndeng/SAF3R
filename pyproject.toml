[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saf3r"
version = "1.0.0"
description = "SAF3R: Dynamic Sparse Attention for Feed-forward 3D Reconstruction Transformers"
authors = [
    { name = "SAF3R Authors" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "tqdm",
    "einops",
    "opencv-python",
    "Pillow",
    "imageio",
    "scipy",
    "matplotlib",
    "huggingface_hub",
    "safetensors",
    "plyfile",
    "moviepy==1.0.3",
    "numpy==1.26.4",
    "trimesh==4.10.0",
    "omegaconf==2.3.0",
    "open3d==0.18.0",
    "evo==1.34.0",
    "pycolmap==3.12.3",
    "addict==2.4.0",
    "triton==3.5.1",
    "hydra-core>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["saf3r*"]
